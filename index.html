<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date — David & Gonzalo | 26.02.2027</title>
    <!-- Google Fonts: Great Vibes, Cormorant Garamond & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oliveDeep: '#4A5238',
                        oliveBase: '#6B7256',
                        oliveLight: '#90987D',
                        ivoryBg: '#F8F6F2',
                        stoneBorder: '#D8D2C5',
                        goldAccent: '#C5B388',
                        charcoalText: '#2C2C2C',
                        backdropWarm: '#EBE7DF',
                    },
                    fontFamily: {
                        script: ['"Great Vibes"', 'cursive'],
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    letterSpacing: {
                        ultra: '0.32em',
                        editorial: '0.22em',
                    }
                }
            }
        }
    </script>
    <style>
        /* Configuración general y suavizado tipográfico */
        body {
            background-color: #EBE7DF;
            color: #2C2C2C;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        /* Ampersand '&' estilizado en Cormorant Garamond itálica */
        .editorial-amp {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 400;
            font-size: 0.68em;
            vertical-align: 0.08em;
            margin: 0 0.14em;
            display: inline-block;
            opacity: 0.92;
        }
        /* =====================================================================
           ESCENA 3D DEL SOBRE CERRADO (Secuencia por etapas para móviles)
           ===================================================================== */
        .envelope-stage {
            perspective: 1200px;
            -webkit-perspective: 1200px;
            transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        .envelope-body {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 16 / 11;
            background: linear-gradient(145deg, #566042 0%, #4A5238 100%);
            box-shadow: 0 24px 55px -12px rgba(44, 44, 44, 0.35), 0 4px 16px rgba(44, 44, 44, 0.15);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            isolation: isolate;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .envelope-body:hover {
            transform: translateY(-2px);
        }
        /* Tarjeta interior que emerge recién después de abrirse la solapa */
        .envelope-inner-card {
            position: absolute;
            left: 6%;
            right: 6%;
            top: 8%;
            bottom: 8%;
            background-color: #F8F6F2;
            border: 1px solid #D8D2C5;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 1px);
            transition: transform 1.35s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        /* Solapas laterales e inferior del bolsillo frontal del sobre (100% opacas) */
        .envelope-pocket {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            overflow: hidden;
            transform: translate3d(0, 0, 2px);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        /* Solapa superior triangular en V con rotación 3D sin parpadeos */
        .envelope-top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 58%;
            z-index: 30;
            transform-origin: top center;
            -webkit-transform-origin: top center;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transform: translate3d(0, 0, 4px) rotateX(0deg);
            transition: transform 1.05s cubic-bezier(0.32, 0.08, 0.24, 1);
            will-change: transform;
        }
        .envelope-top-flap-shape {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #6B7256 0%, #4A5238 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            filter: drop-shadow(0 8px 10px rgba(25, 30, 18, 0.32));
        }
        .envelope-top-flap-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #434A33 0%, #4E563B 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform: rotateX(180deg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        /* Sello de lacre en el vértice */
        .wax-seal-btn {
            position: absolute;
            top: 56%;
            left: 50%;
            transform: translate3d(-50%, -50%, 6px);
            z-index: 40;
            width: 64px;
            height: 64px;
            border-radius: 9999px;
            background: radial-gradient(circle at 32% 30%, #D9C89E 0%, #B8A373 58%, #968255 100%);
            box-shadow:
                0 6px 16px rgba(26, 30, 20, 0.42),
                inset 0 2px 4px rgba(255, 250, 235, 0.55),
                inset 0 -3px 6px rgba(72, 60, 34, 0.45);
            border: 2px solid rgba(248, 246, 242, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
            animation: sealPulse 3.4s ease-in-out infinite;
        }
        .wax-seal-inner {
            width: 48px;
            height: 48px;
            border-radius: 9999px;
            border: 1px solid rgba(74, 82, 56, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes sealPulse {
            0%, 100% { transform: translate3d(-50%, -50%, 6px) scale(1); }
            50% { transform: translate3d(-50%, -50%, 6px) scale(1.05); }
        }
        /* Etapas controladas por clases JS */
        .envelope-stage.step-flap .wax-seal-btn {
            animation: none;
            opacity: 0;
            transform: translate3d(-50%, -50%, 6px) scale(0.75);
            pointer-events: none;
        }
        .envelope-stage.step-flap .envelope-top-flap {
            transform: translate3d(0, 0, 3px) rotateX(180deg);
        }
        /* Al pasar 90 grados, la solapa queda detrás de la tarjeta sin perderse en el fondo */
        .envelope-stage.step-flap-behind .envelope-top-flap {
            z-index: 5;
            transform: translate3d(0, 0, 0px) rotateX(180deg);
        }
        /* Recién ahora sube la tarjeta blanca por delante de la solapa abierta */
        .envelope-stage.step-card-rise .envelope-inner-card {
            z-index: 15;
            transform: translate3d(0, -58%, 1px) scale(1.03);
        }
        /* Fundido suave de salida antes de redirigir a invitacion.html */
        .envelope-stage.step-crossfade {
            opacity: 0;
            transform: scale(1.03);
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center selection:bg-oliveBase selection:text-ivoryBg">
    <!-- =========================================================================
         ESCENA INICIAL: SOBRE 3D INTERACTIVO
         ========================================================================= -->
    <div id="envelope-stage" class="envelope-stage fixed inset-0 z-40 flex flex-col items-center justify-center px-5 bg-backdropWarm">
        
        <p class="font-sans text-[10px] tracking-ultra uppercase text-oliveDeep/80 mb-6 text-center">
            Invitación Digital
        </p>
        <!-- Sobre en verde oliva profundo con solapa triangular y sello de lacre -->
        <div id="envelope-trigger" role="button" tabindex="0" aria-label="Abrir sobre de invitación de David y Gonzalo" class="envelope-body rounded-sm cursor-pointer select-none">
            
            <!-- Tarjeta interior marfil que asoma después de abrirse la solapa -->
            <div class="envelope-inner-card rounded-xs">
                <span class="font-sans text-[8px] tracking-ultra uppercase text-oliveBase mb-1">Save the Date</span>
                <p class="font-script text-3xl sm:text-4xl text-charcoalText leading-none">
                    David <span class="editorial-amp text-oliveDeep">&</span> Gonzalo
                </p>
                <span class="font-serif text-xs tracking-editorial text-oliveDeep mt-1.5">26 · 02 · 2027</span>
            </div>
            <!-- Pliegues laterales e inferior del bolsillo del sobre (100% opacos) -->
            <div class="envelope-pocket rounded-sm">
                <svg class="w-full h-full block" viewBox="0 0 380 261" preserveAspectRatio="none">
                    <polygon points="0,0 190,138 0,261" fill="#464E35" />
                    <polygon points="380,0 190,138 380,261" fill="#424A32" />
                    <polygon points="0,261 190,122 380,261" fill="#4A5238" />
                    <line x1="0" y1="261" x2="190" y2="122" stroke="rgba(216, 210, 197, 0.22)" stroke-width="1" />
                    <line x1="380" y1="261" x2="190" y2="122" stroke="rgba(216, 210, 197, 0.22)" stroke-width="1" />
                </svg>
            </div>
            <!-- Solapa superior triangular en V -->
            <div class="envelope-top-flap">
                <div class="envelope-top-flap-shape"></div>
                <div class="envelope-top-flap-back"></div>
            </div>
            <!-- Sello de Lacre con iniciales -->
            <div class="wax-seal-btn" aria-hidden="true">
                <div class="wax-seal-inner">
                    <span class="font-serif text-[13px] font-semibold tracking-wider text-oliveDeep">D&G</span>
                </div>
            </div>
        </div>
        <!-- Indicación sutil de interacción -->
        <button id="open-hint-btn" type="button" class="mt-7 group flex flex-col items-center gap-1.5 cursor-pointer focus:outline-none">
            <span class="font-sans text-[10px] font-medium tracking-ultra uppercase text-oliveDeep group-hover:text-charcoalText transition-colors">
                Tocar para abrir
            </span>
            <span class="w-8 h-[1px] bg-oliveBase/45 group-hover:w-14 transition-all duration-300"></span>
        </button>
    </div>

    <script>
        const INVITATION_URL = "invitacion.html";

        document.addEventListener('DOMContentLoaded', () => {
            // =================================================================
            // APERTURA 3D DEL SOBRE EN ETAPAS Y REDIRECCIÓN SUAVE
            // =================================================================
            const envelopeStage = document.getElementById('envelope-stage');
            const envelopeTrigger = document.getElementById('envelope-trigger');
            const openHintBtn = document.getElementById('open-hint-btn');
            let isEnvelopeOpened = false;

            function openEnvelopeExperience() {
                if (isEnvelopeOpened) return;
                isEnvelopeOpened = true;
                envelopeTrigger.setAttribute('aria-disabled', 'true');
                openHintBtn.disabled = true;

                // Etapa 1 (0ms): Desvanecer sello de lacre y abrir solapa superior
                envelopeStage.classList.add('step-flap');

                // Etapa 2 (620ms): Cuando la solapa supera los 90°, enviarla detrás de la tarjeta
                setTimeout(() => {
                    envelopeStage.classList.add('step-flap-behind');
                }, 620);

                // Etapa 3 (1050ms): Salida suave y pausada de la tarjeta interior hacia arriba
                setTimeout(() => {
                    envelopeStage.classList.add('step-card-rise');
                }, 1050);

                // Etapa 4 (3150ms): Tras una breve pausa para apreciar la tarjeta, fundido de salida suave
                setTimeout(() => {
                    envelopeStage.classList.add('step-crossfade');
                }, 3150);

                // Etapa 5 (4000ms): Redirección a la invitación completa
                setTimeout(() => {
                    window.location.href = INVITATION_URL;
                }, 4000);
            }

            envelopeTrigger.addEventListener('click', openEnvelopeExperience);
            openHintBtn.addEventListener('click', openEnvelopeExperience);

            envelopeTrigger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openEnvelopeExperience();
                }
            });
        });
    </script>
</body>
</html>
